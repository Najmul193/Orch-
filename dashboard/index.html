<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>orch</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --line: #e3e6eb; --text: #1b1f24; --muted: #6b7380;
    --accent: #3b6fe0; --ok: #1f9d55; --warn: #c27c0e; --bad: #d1435b; --run: #3b6fe0; --code: #f0f2f5; --panel2: #fbfcfd;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0f1115; --panel: #171a20; --line: #2a2f38; --text: #e6e8eb; --muted: #8b93a1;
      --accent: #6f9bff; --ok: #3ccf7f; --warn: #f0a93b; --bad: #ff6b81; --run: #6f9bff; --code: #1f232b; --panel2: #1c2027; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  header { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; padding: 12px 16px; border-bottom: 1px solid var(--line); background: var(--panel); position: sticky; top: 0; z-index: 1; }
  header h1 { font-size: 17px; margin: 0; display: flex; align-items: center; gap: 8px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--bad); display: inline-block; }
  .dot.on { background: var(--ok); }
  header label { display: flex; align-items: center; gap: 6px; color: var(--muted); }
  main { display: grid; grid-template-columns: minmax(300px, 380px) 1fr; gap: 16px; padding: 16px; max-width: 1500px; margin: 0 auto; }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; } }
  section { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; margin-bottom: 16px; min-width: 0; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 0 0 10px; display: flex; justify-content: space-between; align-items: center; }
  h3 { font-size: 13px; margin: 12px 0 6px; }
  button { font: inherit; font-size: 12px; padding: 3px 9px; border-radius: 6px; border: 1px solid var(--line); background: var(--panel); color: var(--text); cursor: pointer; }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  button.danger { color: var(--bad); }
  input, select, textarea { font: inherit; font-size: 13px; padding: 5px 8px; border-radius: 6px; border: 1px solid var(--line); background: var(--bg); color: var(--text); min-width: 0; }
  textarea { width: 100%; min-height: 70px; resize: vertical; }
  .row { display: flex; align-items: center; gap: 8px; padding: 6px 0; border-top: 1px solid var(--line); }
  .row:first-of-type { border-top: 0; }
  .grow { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .muted { color: var(--muted); font-size: 12px; }
  .pill { font-size: 11px; padding: 1px 7px; border-radius: 99px; border: 1px solid currentColor; white-space: nowrap; }
  .s-running, .s-active { color: var(--run); } .s-done { color: var(--ok); } .s-failed, .s-limited { color: var(--bad); }
  .s-killed, .s-idle, .s-queued { color: var(--muted); } .s-cool { color: var(--warn); }
  .runs .row { cursor: pointer; padding: 7px 6px; border-radius: 6px; }
  .runs .row.sel { background: var(--code); }
  .feed { font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; max-height: 55vh; overflow: auto; background: var(--code); border-radius: 8px; padding: 8px 10px; }
  .feed div { white-space: pre-wrap; word-break: break-word; padding: 1px 0; }
  .k-tool { color: var(--accent); } .k-error { color: var(--bad); } .k-info { color: var(--muted); } .k-done { color: var(--ok); }
  .k-text { color: var(--text); border-left: 2px solid var(--line); padding-left: 8px !important; margin: 4px 0; }
  pre { background: var(--code); padding: 8px 10px; border-radius: 8px; overflow: auto; white-space: pre-wrap; font-size: 12px; margin: 6px 0; }
  .form { display: grid; gap: 8px; }
  .form .line { display: flex; gap: 8px; flex-wrap: wrap; }
  .form .line > * { flex: 1; }
  .empty { color: var(--muted); font-size: 13px; padding: 6px 0; }
  .err { color: var(--bad); font-size: 12px; }

  /* Live flow */
  .flowwrap { padding: 16px 16px 0; max-width: 1500px; margin: 0 auto; }
  .flow { margin: 0; background-color: var(--panel); background-image: radial-gradient(var(--line) 1px, transparent 1px); background-size: 18px 18px; }
  .flow svg { display: block; width: 100%; height: auto; max-height: 470px; overflow: visible; }
  .edge { fill: none; stroke: var(--line); stroke-width: 2; transition: stroke .3s; }
  .edge.active { stroke: var(--accent); stroke-width: 2.5; stroke-dasharray: 7 9; animation: dash .7s linear infinite; }
  .edge.active.handoff { stroke: var(--warn); }
  @keyframes dash { to { stroke-dashoffset: -16; } }
  .fnode .card { fill: var(--panel2); stroke: var(--line); stroke-width: 1.5; transition: stroke .3s; }
  .fnode .pulse { fill: none; stroke: var(--accent); opacity: 0; }
  .fnode .sdot { fill: var(--muted); }
  .fnode .t1 { font: 600 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: var(--text); }
  .fnode .t2 { font: 11px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: var(--muted); }
  .fnode .t3 { font: 11px ui-monospace, SFMono-Regular, Menlo, monospace; fill: var(--muted); }
  .fnode[data-st=running] .card { stroke: var(--accent); filter: url(#glow); }
  .fnode[data-st=running] .pulse { animation: pulse 1.8s ease-out infinite; }
  .fnode[data-st=running] .sdot, .fnode[data-st=running] .t3 { fill: var(--accent); }
  .fnode[data-st=cooling] .card { stroke: var(--warn); stroke-dasharray: 5 4; }
  .fnode[data-st=cooling] .sdot, .fnode[data-st=cooling] .t3 { fill: var(--warn); }
  .fnode[data-st=limited] .card { stroke: var(--bad); }
  .fnode[data-st=limited] .pulse { stroke: var(--bad); animation: pulse 1.8s ease-out infinite; }
  .fnode[data-st=limited] .sdot, .fnode[data-st=limited] .t3 { fill: var(--bad); }
  .fnode[data-st=disabled] { opacity: .38; }
  @keyframes pulse { 0% { opacity: .55; stroke-width: 1; } 100% { opacity: 0; stroke-width: 18; } }
  .fnode.flash-go .card { animation: fgo 1s ease-out; }
  .fnode.flash-ok .card { animation: fok 1.3s ease-out; }
  .fnode.flash-bad .card { animation: fbad 1.3s ease-out; }
  .fnode.flash-tick .sdot { animation: tick .5s ease-out; }
  @keyframes fgo { 0%, 25% { stroke: var(--accent); fill: color-mix(in srgb, var(--accent) 22%, var(--panel2)); } }
  @keyframes fok { 0%, 25% { stroke: var(--ok); fill: color-mix(in srgb, var(--ok) 25%, var(--panel2)); } }
  @keyframes fbad { 0%, 25% { stroke: var(--bad); fill: color-mix(in srgb, var(--bad) 25%, var(--panel2)); } }
  @keyframes tick { 0% { r: 9px; } }
  .hub .core { fill: url(#coreg); stroke: var(--line); stroke-width: 2; transition: stroke .3s; }
  .hub .ring { fill: none; stroke: var(--line); stroke-width: 2; stroke-dasharray: 3 9; transform-box: fill-box; transform-origin: center; }
  .hub .halo { fill: none; stroke: var(--accent); opacity: 0; }
  .hub[data-st=running] .core { stroke: var(--accent); }
  .hub[data-st=running] .ring { stroke: var(--accent); animation: spin 5s linear infinite; }
  .hub[data-st=running] .halo { animation: pulse 2.2s ease-out infinite; }
  .hub.flash-go .core { animation: fgo .8s ease-out; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .hub .hubt { font: 700 18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: var(--text); }
  .hub .hubs { font: 11px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: var(--muted); }
  .particle { filter: url(#glow); }
  .p-task { fill: var(--accent); } .p-handoff { fill: var(--warn); } .p-ok { fill: var(--ok); } .p-bad { fill: var(--bad); }
  .ticker { display: flex; flex-direction: column; gap: 4px; margin-top: 8px; height: 124px; overflow: hidden; }
  .ticker:empty::before { content: 'Agent activity shows up here as it happens.'; color: var(--muted); font-size: 12px; }
  .chip { font: 12px ui-monospace, SFMono-Regular, Menlo, monospace; padding: 3px 9px; border-radius: 6px; background: var(--code); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; animation: slidein .35s ease-out; }
  .chip b { font-weight: 600; margin-right: 6px; }
  .chip:nth-child(n+3) { opacity: .7; } .chip:nth-child(n+5) { opacity: .45; }
  @keyframes slidein { from { transform: translateY(-6px); opacity: 0; } }
  @media (prefers-reduced-motion: reduce) {
    .edge.active, .fnode .pulse, .hub .ring, .hub .halo, .chip, .fnode .card, .fnode .sdot { animation: none !important; }
  }
</style>
</head>
<body>
<header>
  <h1><span id="dot" class="dot" title="live connection"></span> orch</h1>
  <label><input type="checkbox" id="autoHandoff"> Auto-handoff when Claude hits its limit</label>
  <label>Parallel <input type="number" id="maxParallel" min="1" max="10" style="width:56px"></label>
  <button id="clearCool">Clear cooldowns</button>
  <span id="msg" class="err"></span>
</header>
<div class="flowwrap">
  <section class="flow">
    <h2>Live flow <span id="flowStats" style="text-transform:none;letter-spacing:0"></span></h2>
    <svg id="flow" role="img" aria-label="Live view of which agent is doing what"></svg>
    <div id="ticker" class="ticker" aria-live="polite"></div>
  </section>
</div>
<main>
  <div>
    <section><h2>Agents</h2><div id="agents"></div></section>
    <section><h2>Claude sessions</h2><div id="sessions"></div></section>
  </div>
  <div>
    <section>
      <h2>New task</h2>
      <div class="form">
        <textarea id="task" placeholder="What should the agent do? Be specific: files, the change, how to know it's done."></textarea>
        <div class="line">
          <input id="dir" placeholder="/absolute/project/folder">
          <select id="chain"></select>
          <select id="model"></select>
          <button class="primary" id="start" style="flex:0">Start</button>
        </div>
      </div>
    </section>
    <section><h2>Runs</h2><div id="runs" class="runs"></div></section>
    <section id="detailBox" hidden><h2><span id="detailTitle" style="text-transform:none;letter-spacing:0;color:var(--text);font-size:14px"></span><span id="detailActions"></span></h2><div id="detail"></div></section>
  </div>
</main>
<datalist id="models-opencode"></datalist>
<datalist id="models-agy"></datalist>
<script>
const $ = (id) => document.getElementById(id)
const state = { config: null, cooldowns: {}, runs: new Map(), sessions: new Map() }
let selected = null
let feed = []

// Build elements with textContent only, so agent output can never inject HTML.
function h(tag, props = {}, ...kids) {
  const el = document.createElement(tag)
  for (const [k, v] of Object.entries(props)) {
    if (k.startsWith('on')) el.addEventListener(k.slice(2), v)
    else if (k === 'class') el.className = v
    else if (v !== false && v != null) el.setAttribute(k, v === true ? '' : v)
  }
  for (const kid of kids.flat()) if (kid != null && kid !== false) el.append(kid instanceof Node ? kid : String(kid))
  return el
}
const ago = (t) => { const s = Math.max(0, (Date.now() - t) / 1000); return s < 60 ? `${s | 0}s` : s < 3600 ? `${(s / 60) | 0}m` : `${(s / 3600).toFixed(1)}h` }
const dur = (a, b) => ago(Date.now() - ((b ?? Date.now()) - a))
const base = (p) => p?.split('/').filter(Boolean).pop() ?? ''

async function api(method, url, body) {
  const res = await fetch(url, { method, headers: { 'content-type': 'application/json' }, body: body && JSON.stringify(body) })
  const out = await res.json()
  $('msg').textContent = res.ok ? '' : out.error
  return res.ok ? out : null
}
const saveChains = () => api('PUT', '/api/config', { chains: state.config.chains })

function renderAgents() {
  const box = $('agents')
  if (box.contains(document.activeElement) && document.activeElement.tagName !== 'BUTTON') return // don't wipe what you're typing
  box.replaceChildren()
  for (const [name, chain] of Object.entries(state.config.chains)) {
    box.append(h('h3', {}, name === 'delegate' ? 'Delegate (small tasks)' : name === 'handoff' ? 'Handoff (Claude hit its limit)' : name))
    chain.forEach((e, i) => {
      const key = `${e.agent}:${e.model}`
      const cool = state.cooldowns[key]
      const busy = [...state.runs.values()].filter((r) => r.status === 'running' && r.agent === e.agent && r.model === e.model).length
      const move = (d) => { const j = i + d; if (j < 0 || j >= chain.length) return; [chain[i], chain[j]] = [chain[j], chain[i]]; saveChains() }
      box.append(h('div', { class: 'row' },
        h('input', { type: 'checkbox', checked: e.enabled !== false, title: 'enabled', onchange: (ev) => { e.enabled = ev.target.checked; saveChains() } }),
        h('span', { class: 'grow', title: key }, h('b', {}, e.agent), ' ', e.model),
        busy ? h('span', { class: 'pill s-running' }, `${busy} running`) : null,
        cool > Date.now() ? h('span', { class: 'pill s-cool' }, `cooling ${dur(Date.now(), cool)}`) : null,
        h('button', { title: 'move up', onclick: () => move(-1) }, '↑'),
        h('button', { title: 'move down', onclick: () => move(1) }, '↓'),
        h('button', { class: 'danger', title: 'remove', onclick: () => { chain.splice(i, 1); saveChains() } }, '✕')))
    })
    const modelIn = h('input', { placeholder: 'search models…', class: 'grow', list: 'models-opencode' })
    const agentSel = h('select', { onchange: (e) => modelIn.setAttribute('list', `models-${e.target.value}`) }, h('option', {}, 'opencode'), h('option', {}, 'agy'))
    box.append(h('div', { class: 'row' }, agentSel, modelIn, h('button', { onclick: () => {
      if (!modelIn.value.trim()) return
      chain.push({ agent: agentSel.value, model: modelIn.value.trim(), enabled: true }); saveChains()
    } }, 'Add')))
  }
}

function renderSessions() {
  const list = [...state.sessions.values()].sort((a, b) => b.lastActivity - a.lastActivity).slice(0, 12)
  $('sessions').replaceChildren(...(list.length ? list.map((s) => h('div', { class: 'row', style: 'align-items:flex-start' },
    h('div', { class: 'grow', style: 'white-space:normal' },
      h('div', {}, h('b', { title: s.cwd }, base(s.cwd) || s.project), ' ', h('span', { class: `pill s-${s.status}` }, s.status)),
      h('div', { class: 'muted grow', title: s.lastTool }, s.limited ? s.limitText : s.lastTool || '—'),
      h('div', { class: 'muted' }, `${ago(s.lastActivity)} ago`)),
    h('button', { title: 'Continue this session on the handoff chain now', onclick: async () => { const r = await api('POST', `/api/sessions/${encodeURIComponent(s.id)}/handoff`, {}); if (r) select(r.id) } }, 'Hand off')))
    : [h('div', { class: 'empty' }, 'No Claude Code sessions in the last 6 hours.')]))
}

function renderRuns() {
  const list = [...state.runs.values()].sort((a, b) => b.createdAt - a.createdAt).slice(0, 60)
  $('runs').replaceChildren(...(list.length ? list.map((r) => h('div', { class: `row${r.id === selected ? ' sel' : ''}`, onclick: () => select(r.id) },
    h('span', { class: `pill s-${r.status}` }, r.status),
    h('span', { class: 'grow', title: r.title }, r.title),
    h('span', { class: 'muted' }, r.agent ? `${r.agent} · ${r.model}` : r.chain),
    h('span', { class: 'muted', title: r.dir }, base(r.dir)),
    h('span', { class: 'muted' }, r.startedAt ? dur(r.startedAt, r.endedAt) : ''),
    ['running', 'queued'].includes(r.status) ? h('button', { class: 'danger', onclick: (ev) => { ev.stopPropagation(); api('POST', `/api/runs/${r.id}/kill`, {}) } }, 'Stop') : null))
    : [h('div', { class: 'empty' }, 'No runs yet. Claude starts them with `orch delegate`, or use the form above.')]))
}

let detail = null
async function select(id) {
  selected = id
  detail = await api('GET', `/api/runs/${id}`)
  feed = detail?.events ?? []
  render()
}

function renderDetail() {
  const r = state.runs.get(selected)
  $('detailBox').hidden = !r
  if (!r) return
  $('detailTitle').textContent = r.title
  $('detailActions').replaceChildren(...(['running', 'queued'].includes(r.status) ? [h('button', { class: 'danger', onclick: () => api('POST', `/api/runs/${r.id}/kill`, {}) }, 'Stop')] : []))
  const box = $('detail')
  const old = box.querySelector('.feed')
  const atBottom = !old || old.scrollHeight - old.scrollTop - old.clientHeight < 40
  const feedEl = h('div', { class: 'feed' }, feed.length ? feed.map((e) => h('div', { class: `k-${e.kind}` },
    e.kind === 'tool' ? `▸ ${e.text}` : e.kind === 'done' ? '✓ finished' : e.kind === 'error' ? `✗ ${e.text}` : e.kind === 'info' ? `· ${e.text}` : e.text)) : h('div', { class: 'k-info' }, 'waiting for output…'))
  box.replaceChildren(h('div', {},
    h('div', { class: 'muted' }, h('span', { class: `pill s-${r.status}` }, r.status), ` ${r.agent ?? ''} ${r.model ?? ''} · ${r.dir} · ${r.chain} · from ${r.source}`),
    r.error ? h('div', { class: 'err' }, r.error) : null,
    r.attempts?.length > 1 ? h('div', { class: 'muted' }, 'Attempts: ', r.attempts.map((a) => `${a.model} ${a.ok ? '✓' : '✗'}`).join(' → ')) : null,
    r.resume ? h('div', {}, h('h3', {}, 'Keep talking to this agent'), h('pre', {}, r.resume)) : null,
    detail?.task ? h('details', { open: taskOpen, ontoggle: (e) => { taskOpen = e.target.open } }, h('summary', { class: 'muted' }, 'Task sent to the agent'), h('pre', {}, detail.task)) : null,
    h('h3', {}, 'Live activity'), feedEl))
  if (atBottom) feedEl.scrollTop = feedEl.scrollHeight
  else feedEl.scrollTop = old.scrollTop
}
let taskOpen = false

function renderForm() {
  const chainSel = $('chain')
  if (!chainSel.options.length) for (const name of Object.keys(state.config.chains)) chainSel.append(h('option', { value: name }, `${name} chain`))
  const models = [...new Set(Object.values(state.config.chains).flat().map((e) => `${e.agent}|${e.model}`))]
  const cur = $('model').value
  $('model').replaceChildren(h('option', { value: '' }, 'first available model'), ...models.map((m) => h('option', { value: m }, m.replace('|', ' · '))))
  $('model').value = cur
  $('autoHandoff').checked = !!state.config.autoHandoff
  const dirIn = $('dir')
  dirIn.placeholder = state.config.defaultDir ? `${state.config.defaultDir} (default — leave blank to use it)` : '/absolute/project/folder'
  if (document.activeElement !== $('maxParallel')) $('maxParallel').value = state.config.maxParallel ?? 3
}

// The detail panel only redraws when its run changes, so selecting or copying text in it works.
let queued = false
let detailDirty = false
function render(detailToo = true) {
  detailDirty ||= detailToo
  if (queued || !state.config) return
  queued = true
  requestAnimationFrame(() => {
    queued = false
    renderAgents(); renderSessions(); renderRuns(); renderFlow()
    if (detailDirty) { detailDirty = false; renderDetail() }
  })
}

async function load() {
  const s = await api('GET', '/api/state')
  if (!s) return
  state.config = s.config
  state.cooldowns = s.cooldowns
  state.runs = new Map(s.runs.map((r) => [r.id, r]))
  state.sessions = new Map(s.sessions.map((x) => [x.id, x]))
  renderForm()
  render()
}

const es = new EventSource('/events')
es.onopen = () => { $('dot').classList.add('on'); load() }
es.onerror = () => $('dot').classList.remove('on')
es.onmessage = (m) => {
  const msg = JSON.parse(m.data)
  flowOn(msg) // before state changes, so it can compare old and new
  if (msg.type === 'run') state.runs.set(msg.run.id, msg.run)
  if (msg.type === 'session') state.sessions.set(msg.session.id, msg.session)
  if (msg.type === 'config') { state.config = msg.config; state.cooldowns = msg.cooldowns; renderForm() }
  if (msg.type === 'event' && msg.ev.runId === selected) feed.push(msg.ev)
  if (msg.type === 'run' && !selected && msg.run.status === 'running') return select(msg.run.id)
  render((msg.type === 'run' && msg.run.id === selected) || (msg.type === 'event' && msg.ev.runId === selected))
}

$('autoHandoff').onchange = (e) => api('PUT', '/api/config', { autoHandoff: e.target.checked })
$('maxParallel').onchange = (e) => api('PUT', '/api/config', { maxParallel: Number(e.target.value) })
$('clearCool').onclick = () => api('DELETE', '/api/cooldowns')
$('start').onclick = async () => {
  const [agent, model] = $('model').value ? $('model').value.split('|') : []
  const r = await api('POST', '/api/runs', { task: $('task').value, dir: $('dir').value.trim(), chain: $('chain').value, agent, model, source: 'dashboard' })
  if (r) { $('task').value = ''; select(r.id) }
}
setInterval(() => render(false), 1000) // keep elapsed times and cooldown countdowns fresh

// Model suggestions for the "Add" rows (the CLIs are slow to list them, so load once in the background).
fetch('/api/models').then((r) => r.json()).then((all) => {
  for (const [agent, list] of Object.entries(all)) {
    $(`models-${agent}`)?.replaceChildren(...[...list].sort((a, b) => /free/.test(b) - /free/.test(a)).map((m) => h('option', { value: m }, /free/.test(m) ? 'free' : agent)))
  }
}).catch(() => {})

// ---------- Live flow: sources → orch hub → agents, animated from the SSE stream ----------
const NS = 'http://www.w3.org/2000/svg'
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches
const flow = { sig: '', nodes: {}, edges: {}, particles: [], raf: 0, activity: new Map(), outcome: new Map() }
const fit = (t, n) => { t = String(t ?? '').replace(/\s+/g, ' ').trim(); return t.length > n ? t.slice(0, n - 1) + '…' : t }

function s(tag, attrs = {}, ...kids) {
  const el = document.createElementNS(NS, tag)
  for (const [k, v] of Object.entries(attrs)) el.setAttribute(k, v)
  el.append(...kids)
  return el
}

function flowAgents() {
  const m = new Map()
  for (const [chain, list] of Object.entries(state.config.chains)) list.forEach((e, i) => {
    const key = `${e.agent}:${e.model}`
    const n = m.get(key) ?? { key, agent: e.agent, model: e.model, tags: [], enabled: false }
    n.tags.push(`${chain} #${i + 1}`)
    n.enabled ||= e.enabled !== false
    m.set(key, n)
  })
  for (const r of state.runs.values()) {
    const key = `${r.agent}:${r.model}`
    if (r.agent && r.status === 'running' && !m.has(key)) m.set(key, { key, agent: r.agent, model: r.model, tags: ['picked by hand'], enabled: true })
  }
  return [...m.values()]
}

function fnode(id, x, y, w, hgt) {
  const g = s('g', { class: 'fnode', transform: `translate(${x},${y})` },
    s('rect', { class: 'pulse', x: -2, y: -2, width: w + 4, height: hgt + 4, rx: 14 }),
    s('rect', { class: 'card', width: w, height: hgt, rx: 12 }),
    s('circle', { class: 'sdot', cx: 17, cy: 20, r: 4.5 }),
    s('text', { class: 't1', x: 29, y: 25 }), s('text', { class: 't2', x: 17, y: 43 }), s('text', { class: 't3', x: 17, y: 59 }))
  flow.nodes[id] = { g, t1: g.children[3], t2: g.children[4], t3: g.children[5] }
  return g
}

function fedge(id, [x1, y1], [x2, y2]) {
  const mx = (x1 + x2) / 2
  return (flow.edges[id] = s('path', { class: 'edge', d: `M${x1},${y1} C${mx},${y1} ${mx},${y2} ${x2},${y2}` }))
}

// Rebuild the drawing only when the set of agents changes; otherwise just update it in place.
function layoutFlow() {
  const list = flowAgents()
  const sig = list.map((a) => a.key).join('|')
  if (sig === flow.sig) return list
  flow.sig = sig
  const AH = 68, GAP = 12
  const H = Math.max(250, list.length * (AH + GAP) + 28)
  const cy = H / 2, hx = 480, hr = 50, ax = 718
  $('flow').setAttribute('viewBox', `0 0 1000 ${H}`)
  flow.nodes = {}; flow.edges = {}; flow.particles = []
  const edges = s('g'), nodes = s('g')
  flow.layer = s('g')
  nodes.append(fnode('claude', 18, cy - 88, 232, AH), fnode('dash', 18, cy + 20, 232, AH))
  edges.append(fedge('claude', [250, cy - 54], [hx - hr, cy]), fedge('dash', [250, cy + 54], [hx - hr, cy]))
  const top = (H - list.length * (AH + GAP) + GAP) / 2
  list.forEach((a, i) => {
    const y = top + i * (AH + GAP)
    nodes.append(fnode(a.key, ax, y, 264, AH))
    edges.append(fedge(a.key, [hx + hr, cy], [ax, y + AH / 2]))
  })
  const hub = s('g', { class: 'hub', transform: `translate(${hx},${cy})` },
    s('circle', { class: 'halo', r: hr + 12 }), s('circle', { class: 'ring', r: hr + 7 }), s('circle', { class: 'core', r: hr }),
    s('text', { class: 'hubt', y: 7, 'text-anchor': 'middle' }, 'orch'), s('text', { class: 'hubs', y: hr + 30, 'text-anchor': 'middle' }))
  flow.nodes.hub = { g: hub, sub: hub.children[4] }
  const defs = s('defs', {},
    s('filter', { id: 'glow', x: '-50%', y: '-50%', width: '200%', height: '200%' },
      s('feGaussianBlur', { stdDeviation: 3.5, result: 'b' }), s('feMerge', {}, s('feMergeNode', { in: 'b' }), s('feMergeNode', { in: 'SourceGraphic' }))),
    s('radialGradient', { id: 'coreg' }, s('stop', { offset: '0%', style: 'stop-color:var(--accent);stop-opacity:.45' }), s('stop', { offset: '100%', style: 'stop-color:var(--accent);stop-opacity:.06' })))
  $('flow').replaceChildren(defs, edges, hub, nodes, flow.layer)
  return list
}

function setNode(id, st, t1, t2, t3) {
  const n = flow.nodes[id]
  if (!n) return
  n.g.dataset.st = st
  n.t1.textContent = t1; n.t2.textContent = t2; n.t3.textContent = t3
}

function renderFlow() {
  const list = layoutFlow()
  const now = Date.now()
  const runs = [...state.runs.values()]
  const running = runs.filter((r) => r.status === 'running')
  const queued = runs.filter((r) => r.status === 'queued').length
  const sessions = [...state.sessions.values()].sort((a, b) => b.lastActivity - a.lastActivity)
  const limited = sessions.find((x) => x.limited)
  const active = sessions.filter((x) => x.status === 'active').length
  const fromClaude = running.filter((r) => r.source !== 'dashboard')
  const fromDash = running.filter((r) => r.source === 'dashboard')

  setNode('claude', limited ? 'limited' : active || fromClaude.length ? 'running' : 'idle', 'Claude Code',
    limited ? `limit hit · resets ${fit(limited.limitText.split('resets')[1], 26)}` : `${active} active session${active === 1 ? '' : 's'} · ${fromClaude.length} delegated`,
    fit(limited ? 'work continues on free agents' : sessions[0]?.lastTool || 'waiting', 34))
  setNode('dash', fromDash.length ? 'running' : 'idle', 'You · dashboard', `${fromDash.length} task${fromDash.length === 1 ? '' : 's'} running`, fromDash.length ? fit(fromDash[0].title, 34) : 'start one below')
  flow.edges.claude?.classList.toggle('active', fromClaude.length > 0)
  flow.edges.claude?.classList.toggle('handoff', fromClaude.some((r) => r.chain === 'handoff'))
  flow.edges.dash?.classList.toggle('active', fromDash.length > 0)

  flow.nodes.hub.g.dataset.st = running.length ? 'running' : 'idle'
  flow.nodes.hub.sub.textContent = `${running.length} running · ${queued} queued`

  let busy = 0, cooling = 0
  for (const a of list) {
    const run = running.find((r) => `${r.agent}:${r.model}` === a.key)
    const cool = state.cooldowns[a.key] > now
    const out = flow.outcome.get(a.key)
    const st = run ? 'running' : cool ? 'cooling' : a.enabled ? 'idle' : 'disabled'
    busy += !!run; cooling += cool
    const t3 = run ? flow.activity.get(a.key) || 'working…'
      : out && now - out.t < 8000 ? out.text
      : cool ? `cooling down · ${dur(now, state.cooldowns[a.key])} left` : a.enabled ? 'idle · ready' : 'disabled'
    setNode(a.key, st, fit(a.model.replace(/^opencode\//, ''), 27), fit(`${a.agent} · ${a.tags.join(' · ')}`, 40), fit(t3, 38))
    flow.edges[a.key].classList.toggle('active', !!run)
    flow.edges[a.key].classList.toggle('handoff', run?.chain === 'handoff')
  }
  $('flowStats').textContent = `${busy} working · ${cooling} cooling down · ${list.length - busy - cooling} ready`
}

// A glowing comet that travels along an edge.
function spark(edgeId, cls, { reverse = false, ms = 1000, then } = {}) {
  const path = flow.edges[edgeId]
  if (!path || reduceMotion || document.hidden) return then?.()
  const len = path.getTotalLength()
  const start = path.getPointAtLength(reverse ? len : 0)
  const trail = [0, 1, 2, 3].map((i) => s('circle', { class: `particle ${cls}`, r: 5.5 - i * 1.2, opacity: 1 - i * 0.22, cx: start.x, cy: start.y }))
  flow.layer.append(...trail)
  flow.particles.push({ path, len, t0: performance.now(), ms, reverse, trail, then })
  if (!flow.raf) flow.raf = requestAnimationFrame(stepParticles)
}

function stepParticles(now) {
  const finished = []
  flow.particles = flow.particles.filter((p) => {
    const k = (now - p.t0) / p.ms
    if (k >= 1.12) { p.trail.forEach((c) => c.remove()); finished.push(p); return false }
    p.trail.forEach((c, i) => {
      let q = Math.min(1, Math.max(0, k - i * 0.04))
      q = q < 0.5 ? 2 * q * q : 1 - (-2 * q + 2) ** 2 / 2
      const pt = p.path.getPointAtLength((p.reverse ? 1 - q : q) * p.len)
      c.setAttribute('cx', pt.x); c.setAttribute('cy', pt.y)
    })
    return true
  })
  flow.raf = 0
  finished.forEach((p) => p.then?.()) // after the list is replaced, so comets they start aren't lost
  if (flow.particles.length && !flow.raf) flow.raf = requestAnimationFrame(stepParticles)
}

function flash(id, cls) {
  const g = flow.nodes[id]?.g
  if (!g) return
  g.classList.remove(cls); void g.getBBox(); g.classList.add(cls)
  clearTimeout(g[cls]); g[cls] = setTimeout(() => g.classList.remove(cls), 1300)
}

function ticker(ev) {
  const box = $('ticker')
  box.prepend(h('div', { class: `chip k-${ev.kind}` }, h('b', {}, fit(ev.model?.replace(/^opencode\//, ''), 26)), fit(ev.text, 140)))
  while (box.children.length > 5) box.lastChild.remove()
}

function flowOn(msg) {
  if (!state.config || !flow.layer) return
  if (msg.type === 'run') {
    const r = msg.run, prev = state.runs.get(r.id)
    const src = r.source === 'dashboard' ? 'dash' : 'claude'
    const key = `${r.agent}:${r.model}`
    const cls = r.chain === 'handoff' ? 'p-handoff' : 'p-task'
    if (r.status === 'running' && r.agent && (prev?.agent !== r.agent || prev?.model !== r.model)) {
      flow.activity.set(key, `starting: ${r.title}`)
      const toAgent = () => { renderFlow(); spark(key, cls, { then: () => flash(key, 'flash-go') }) }
      // A fallback leaves straight from the hub; a new task travels source → hub → agent.
      if (prev?.agent) toAgent()
      else spark(src, cls, { ms: 800, then: () => { flash('hub', 'flash-go'); toAgent() } })
    }
    if (prev && prev.status !== r.status && ['done', 'failed', 'killed'].includes(r.status) && r.agent) {
      const ok = r.status === 'done', pc = ok ? 'p-ok' : 'p-bad'
      flow.outcome.set(key, { t: Date.now(), text: `${ok ? '✓ finished' : r.status === 'killed' ? '■ stopped' : '✗ failed'}: ${r.title}` })
      flash(key, ok ? 'flash-ok' : 'flash-bad')
      spark(key, pc, { reverse: true, ms: 900, then: () => spark(src, pc, { reverse: true, ms: 800, then: () => flash(src, ok ? 'flash-ok' : 'flash-bad') }) })
    }
  }
  if (msg.type === 'event') {
    const ev = msg.ev, key = `${ev.agent}:${ev.model}`
    if (ev.kind === 'tool' || ev.kind === 'text') {
      flow.activity.set(key, ev.kind === 'tool' ? `▸ ${ev.text}` : `“${ev.text}”`)
      flash(key, 'flash-tick')
    }
    if (ev.kind === 'error' || (ev.kind === 'info' && /failed/.test(ev.text))) {
      flash(key, 'flash-bad')
      spark(key, 'p-bad', { reverse: true, ms: 700 })
    }
    if (ev.kind !== 'info' || /failed|skip/.test(ev.text)) ticker(ev)
  }
  if (msg.type === 'session') {
    const prev = state.sessions.get(msg.session.id)
    if (msg.session.limited && prev && !prev.limited) { flash('claude', 'flash-bad'); spark('claude', 'p-handoff', { ms: 1000 }) }
    else if (prev && msg.session.lastTool !== prev.lastTool) flash('claude', 'flash-tick')
  }
}
</script>
</body>
